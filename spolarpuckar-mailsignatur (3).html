<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; padding:0; background:#ffffff; }
  body { padding:48px; font-family:'Inter',Arial,Helvetica,sans-serif; -webkit-font-smoothing:antialiased; }
  a { text-decoration:none; }
</style>
</head>
<body>

<table cellpadding="0" cellspacing="0" border="0" role="presentation"
       style="border-collapse:separate;background:#0F1720;border-radius:16px;color:#F6F8F0;overflow:hidden;">
  <tr>
    <!-- Mint accent rail (6px) -->
    <td style="width:6px;background:#61F2B0;font-size:0;line-height:0;">&nbsp;</td>

    <!-- Main column -->
    <td style="padding:36px 40px;vertical-align:top;">

      <!-- Brand wordmark + droplet -->
      <table cellpadding="0" cellspacing="0" border="0" role="presentation">
        <tr>
          <td style="font-family:'Inter',Arial,sans-serif;font-size:28px;font-weight:800;color:#F6F8F0;letter-spacing:-0.7px;line-height:1;padding-right:12px;">
            Spolarpuckar
          </td>
          <td style="vertical-align:middle;padding-bottom:3px;">
            <svg width="22" height="29" viewBox="0 0 24 32" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 1.5C12 1.5 2.5 12.4 2.5 20.2C2.5 25.6 6.75 30 12 30C17.25 30 21.5 25.6 21.5 20.2C21.5 12.4 12 1.5 12 1.5Z"
                    fill="none" stroke="#61F2B0" stroke-width="2.4" stroke-linejoin="round"/>
            </svg>
          </td>
        </tr>
      </table>

      <!-- Divider -->
      <div style="height:1px;background:#1f2a36;margin:22px 0 22px 0;width:300px;font-size:0;line-height:0;">&nbsp;</div>

      <!-- Name -->
      <div style="font-family:'Inter',Arial,sans-serif;font-size:16px;font-weight:700;color:#F6F8F0;line-height:1.2;letter-spacing:-0.2px;">
        Magnus Svensson
      </div>
      <!-- Title -->
      <div style="font-family:'Inter',Arial,sans-serif;font-size:11px;font-weight:600;color:#61F2B0;margin-top:6px;letter-spacing:1.6px;text-transform:uppercase;">
        Founder &amp; CEO
      </div>

      <!-- Contact -->
      <table cellpadding="0" cellspacing="0" border="0" role="presentation"
             style="margin-top:22px;font-family:'Inter',Arial,sans-serif;font-size:13px;color:#F6F8F0;line-height:1.5;">
        <tr>
          <td style="color:#61F2B0;font-weight:700;font-size:11px;padding:3px 14px 3px 0;letter-spacing:1px;vertical-align:middle;">T</td>
          <td style="padding:3px 0;font-weight:400;vertical-align:middle;">
            <a href="tel:+46735195050" style="color:#F6F8F0;">+46 (0) 735 19 50 50</a>
          </td>
        </tr>
        <tr>
          <td style="color:#61F2B0;font-weight:700;font-size:11px;padding:3px 14px 3px 0;letter-spacing:1px;vertical-align:middle;">E</td>
          <td style="padding:3px 0;font-weight:400;vertical-align:middle;">
            <a href="mailto:magnus@spolarpuckar.se" style="color:#F6F8F0;">magnus@spolarpuckar.se</a>
          </td>
        </tr>
        <tr>
          <td style="color:#61F2B0;font-weight:700;font-size:11px;padding:3px 14px 3px 0;letter-spacing:1px;vertical-align:middle;">W</td>
          <td style="padding:3px 0;font-weight:400;vertical-align:middle;">
            <a href="https://www.spolarpuckar.se" style="color:#F6F8F0;">www.spolarpuckar.se</a>
          </td>
        </tr>
      </table>

    </td>

    <!-- Tagline column -->
    <td style="padding:36px 44px;vertical-align:middle;border-left:1px solid #1f2a36;">
      <div style="font-family:'Inter',Arial,sans-serif;font-size:24px;font-weight:700;color:#F6F8F0;letter-spacing:-0.5px;line-height:1.15;white-space:nowrap;">
        Just Add <span style="color:#61F2B0;">Water.</span>
      </div>
    </td>
  </tr>
</table>

</body>
</html>
